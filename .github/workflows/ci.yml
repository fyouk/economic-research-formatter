name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: >-
          python -m pytest -q
          --cov=economic_research_formatter
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Validate bundled rules
        run: python -m economic_research_formatter.cli validate-rules
      - name: Build wheel
        run: python -m build
      - name: Wheel smoke test outside checkout
        run: python scripts/wheel_smoke.py dist/*.whl
